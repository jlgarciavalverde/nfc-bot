# Se copia a ~/servicios/nfc/ en el VPS (tools/deploy.mjs). Sin `ports:` a propósito: el panel solo se alcanza
# por el túnel de Cloudflare (red `proxy`) y Postgres solo desde la red interna.
services:
  web:
    image: nfc-bot:0.1.0
    container_name: nfc-web
    restart: unless-stopped
    # Docker del VPS es rootless: el root del contenedor es el usuario del host, sin privilegios reales.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      DATABASE_URL: postgres://nfc:${POSTGRES_PASSWORD}@db:5432/nfc
      PUBLIC_URL: ${PUBLIC_URL}
      APP_VERSION: ${APP_VERSION}
      LOG_LEVEL: warn
    command: ["node", "api/dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 15s
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [proxy, internal]

  # El bot habla con Telegram por long polling (sale a internet, no necesita ruta pública).
  # Arranca cuando la web está sana: la web aplica las migraciones.
  bot:
    image: nfc-bot:0.1.0
    container_name: nfc-bot
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      DATABASE_URL: postgres://nfc:${POSTGRES_PASSWORD}@db:5432/nfc
      BOT_TOKEN: ${BOT_TOKEN}
      SETUP_CODE: ${SETUP_CODE}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL}
      APP_VERSION: ${APP_VERSION}
    command: ["node", "bot/dist/bot.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 30s
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [proxy, internal]

  db:
    image: postgres:17-alpine
    container_name: nfc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nfc
    volumes: [nfc-db:/var/lib/postgresql/data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfc"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [internal]

  # Copia diaria a las 4:00 (Madrid) con pg_dump, 30 días en ./backups, y simulacro de restauración justo después:
  # la copia se restaura en una BD aparte (nfc_simulacro) y se comprueba que tiene todas las tablas. Resultado en
  # ./backups/simulacro.txt. Al arrancar, si falta la copia de hoy, la hace en el momento.
  backup:
    image: postgres:17-alpine
    container_name: nfc-backup
    restart: unless-stopped
    user: "0:0"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGUSER: nfc
      TZ: Europe/Madrid
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        copia() {
          f=/backups/nfc-$$(date +%F).sql.gz
          pg_dump -d nfc --no-owner | gzip > $$f.tmp && mv $$f.tmp $$f || { echo "$$(date '+%F %T') FALLO: pg_dump" | tee /backups/simulacro.txt; return 1; }
          find /backups -name 'nfc-*.sql.gz' -mtime +30 -delete
          find /backups -name 'pre-*.sql.gz' -mtime +90 -delete
          psql -q -d postgres -c 'drop database if exists nfc_simulacro' -c 'create database nfc_simulacro' >/dev/null
          if gunzip -c $$f | psql -q -v ON_ERROR_STOP=1 -d nfc_simulacro >/dev/null 2>/tmp/err; then
            t=$$(psql -tA -d nfc_simulacro -c "select count(*) from information_schema.tables where table_schema = 'public'")
            m=$$(psql -tA -d nfc_simulacro -c "select count(*) from drizzle.__drizzle_migrations")
            v=$$(psql -tA -d nfc_simulacro -c "select (select count(*) from ventas) || ' ventas, ' || (select count(*) from comercios) || ' comercios, ' || (select count(*) from movimientos) || ' movimientos'")
            if [ "$$t" -ge 15 ]; then r="OK: $$f restaurada ($$t tablas, $$m migraciones, $$v)"; else r="FALLO: $$f solo tiene $$t tablas"; fi
          else
            r="FALLO: $$f no se restaura: $$(head -c 300 /tmp/err)"
          fi
          psql -q -d postgres -c 'drop database if exists nfc_simulacro' >/dev/null
          echo "$$(date '+%F %T') $$r" | tee /backups/simulacro.txt
        }
        [ -f /backups/nfc-$$(date +%F).sql.gz ] || copia
        while true; do
          sleep 600
          [ "$$(date +%H)" = "04" ] && [ ! -f /backups/nfc-$$(date +%F).sql.gz ] && copia
        done
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  nfc-db:

networks:
  proxy:
    external: true
  internal:
    internal: true
